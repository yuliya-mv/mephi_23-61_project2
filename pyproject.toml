[project]
name = "mephi-sprint-23-61"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yuliya-mv", email = "yuu.khoang@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mephi-sprint-23-61 = "mephi_sprint_23_61:main"

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.poetry.scripts]
project = "src.primitive_db.main:main" 